<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>StripLink Manual</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  
  <!-- Uradna Docsify temna tema -->
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify/lib/themes/dark.css">
  
  <style>
    :root {
      --theme-color: #529cca;
    }
    body {
      background-color: #191919;
    }
    .sidebar {
      background-color: #141414;
    }

    /* Standardna velikost in postavitev vseh videoposnetkov */
    .markdown-section video {
      display: block !important;
      width: 320px !important;
      max-width: 100% !important;
      height: auto !important;
      margin: 20px auto !important;
    }

    /* Popolnoma nevidne tabele (brez belih robov in brez belega ozadja celic) */
    .markdown-section table,
    .markdown-section table tr,
    .markdown-section table tr:nth-child(2n),
    .markdown-section table td,
    .markdown-section table th {
      border: none !important;
      background-color: transparent !important;
    }

    /* Diskretna, mehka temno siva ločilna črta med razdelki (---) */
    .markdown-section hr {
      border: none !important;
      border-top: 1px solid #282828 !important;
      margin: 2.5em 0 !important;
    }

/* Odstranitev svetlih obrob pod naslovi */
    .markdown-section h1,
    .markdown-section h2,
    .markdown-section h3 {
      border-bottom: none !important;
    }

    /* Centriranje vseh slik v dokumentaciji */
    .markdown-section img {
      display: block !important;
      margin: 20px auto !important;
    }

    /* Povečana pisava (npr. na 16px ali 17px) */
    body, .markdown-section {
      font-size: 16px !important; 
    }

  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    window.$docsify = {
      name: 'StripLink Manual',
      repo: '', 
      loadSidebar: true,
      subMaxLevel: 2,
      auto2top: true,
      
      // Vgrajen iskalnik
      search: {
        placeholder: 'Search manual...',
        noData: 'No results found.',
        depth: 3
      }
    }
  </script>
  <!-- Docsify skripte -->
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/docsify.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
</body>
</html>
