```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>StripLink Manual</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">

  <!-- Docsify dark theme -->
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify/lib/themes/dark.css">

  <style>
    :root {
      --theme-color: #529cca;
    }

    body {
      background-color: #191919;
    }

    .sidebar {
      background-color: #141414;
    }

    /* =========================================
       GENERAL TEXT SIZE
       ========================================= */

    .markdown-section {
      font-size: 20px !important;
      line-height: 1.6 !important;
    }

    .markdown-section p,
    .markdown-section li,
    .markdown-section td,
    .markdown-section th {
      font-size: 24px !important;
      line-height: 1.6 !important;
    }

    /* =========================================
       BLOCKQUOTES / IMPORTANT NOTES
       ========================================= */

    .markdown-section blockquote,
    .markdown-section blockquote p {
      font-size: 20px !important;
      line-height: 1.6 !important;
    }

    /* =========================================
       HEADINGS
       ========================================= */

    .markdown-section h1 {
      font-size: 28px !important;
      line-height: 1.3 !important;
    }

    .markdown-section h2 {
      font-size: 28px !important;
      line-height: 1.35 !important;
    }

    .markdown-section h3 {
      font-size: 24px !important;
      line-height: 1.4 !important;
    }

    /* =========================================
       STANDARD VIDEO SIZE
       ========================================= */

    .markdown-section video {
      display: block !important;
      width: 320px !important;
      max-width: 100% !important;
      height: auto !important;
      margin: 20px auto !important;
    }

    /* =========================================
       INVISIBLE TABLES
       ========================================= */

    .markdown-section table,
    .markdown-section table tr,
    .markdown-section table tr:nth-child(2n),
    .markdown-section table td,
    .markdown-section table th {
      border: none !important;
      background-color: transparent !important;
    }

    /* =========================================
       HORIZONTAL RULES
       ========================================= */

    .markdown-section hr {
      border: none !important;
      border-top: 1px solid #282828 !important;
      margin: 2.5em 0 !important;
    }

    /* =========================================
       REMOVE BORDERS UNDER HEADINGS
       ========================================= */

    .markdown-section h1,
    .markdown-section h2,
    .markdown-section h3 {
      border-bottom: none !important;
    }

    /* =========================================
       CENTER ALL DOCUMENTATION IMAGES
       ========================================= */

    .markdown-section img {
      display: block !important;
      margin: 20px auto !important;
    }

    /* =========================================
       INLINE CODE
       Same size as the main text
       ========================================= */

    .markdown-section code {
      font-size: 24px !important;
    }

    /* =========================================
       CODE BLOCKS
       Keep code blocks smaller
       ========================================= */

    .markdown-section pre code {
      font-size: 14px !important;
    }
    /* =========================================
       SIDEBAR TEXT SIZE
       ========================================= */

    .sidebar {
      font-size: 16px !important;
    }

    .sidebar-nav ul li a {
      font-size: 16px !important;
      line-height: 1.5 !important;
    }

    .sidebar-nav ul li strong {
      font-size: 16px !important;
      line-height: 1.5 !important;
    }

    /* =========================================
       LAYOUT CONCEPTS IMAGE GRID
       ========================================= */
    
    .layout-concepts-grid {
      display: grid !important;
      grid-template-columns: repeat(4, minmax(0, 1fr)) !important;
      gap: 10px;
      width: 100%;
      max-width: 1400px;
      margin: 20px auto;
      align-items: start;
    }
    
    .markdown-section .layout-concepts-grid img {
      display: block !important;
      width: 100% !important;
      min-width: 0 !important;
      max-width: 100% !important;
      height: auto !important;
      margin: 0 auto !important;
    }
    
    /* Four images in one column on narrower screens */
    @media screen and (max-width: 1200px) {
      .layout-concepts-grid {
        grid-template-columns: 1fr !important;
      }
    
      .markdown-section .layout-concepts-grid img {
        width: 100% !important;
        max-width: 1000px !important;
      }
    }
    
    /* =========================================
       MOBILE
       Approximately 1.7x smaller
       ========================================= */

    @media screen and (max-width: 1200px) {

      .markdown-section {
        font-size: 14px !important;
        line-height: 1.6 !important;
      }

      .markdown-section p,
      .markdown-section li,
      .markdown-section td,
      .markdown-section th {
        font-size: 14px !important;
        line-height: 1.6 !important;
      }

      .markdown-section blockquote,
      .markdown-section blockquote p {
        font-size: 14px !important;
        line-height: 1.6 !important;
      }

      .markdown-section h1 {
        font-size: 20px !important;
        line-height: 1.3 !important;
      }

      .markdown-section h2 {
        font-size: 20px !important;
        line-height: 1.35 !important;
      }

      .markdown-section h3 {
        font-size: 18px !important;
        line-height: 1.4 !important;
      }

      .markdown-section code {
        font-size: 14px !important;
      }

      .markdown-section pre code {
        font-size: 14px !important;
      }
    }

  </style>
</head>

<body>

  <div id="app"></div>

  <script>
    window.$docsify = {
      name: 'StripLink Manual',
      repo: '',
      loadSidebar: true,
      subMaxLevel: 2,
      auto2top: true,

      search: {
        placeholder: 'Search manual...',
        noData: 'No results found.',
        depth: 3
      }
    }
  </script>

  <!-- Docsify -->
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/docsify.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>

</body>
</html>
